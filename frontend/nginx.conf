server {
    listen 80;
    server_tokens off;
    client_max_body_size 2m;  # .eml uploads; the backend enforces its own limits too
    root /usr/share/nginx/html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    # 'unsafe-inline' styles: React sets bar widths with style="". No inline scripts are allowed.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # Same origin as the page, so the login cookie needs no CORS. The backend is not published.
    location /api/ {
        # Look the backend up at request time (Docker DNS), so a backend restart never
        # leaves nginx pointing at an old address.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend http://backend:8000;
        proxy_pass $backend;
        proxy_set_header X-Forwarded-For $remote_addr;  # overwrite, so visitors cannot spoof it
        proxy_read_timeout 30s;
    }

    location / {
        try_files $uri /index.html;
    }
}
